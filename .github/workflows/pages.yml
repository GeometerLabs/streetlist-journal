# Publishes the Streetlist Journal to GitHub Pages (journal.streetlist.in) on every push to main, which includes every save in
# Pages CMS (a save is a commit), and on demand from the Actions tab. It installs the exact packages from package-lock.json, builds
# the site (pages, pictures, feeds), runs the quick build checks (links, feeds, pages, sizes; the word, migration and browser
# checks run on the owner's machine, so a typo fix in a piece is never held back), and hands dist/ to GitHub Pages.
# Every action is pinned to a full commit (the tag it was in a comment), so a moved tag cannot change what runs here.
# The custom domain is set in the repository's Settings > Pages (a CNAME file is ignored by Actions deploys); see README.md.
name: Publish the Journal

on:
  push:
    branches: [main]
  workflow_dispatch:

# The least the deploy needs: read the code, write to Pages, and prove who is deploying (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24 (runs the TypeScript build scripts directly)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the exact packages
        run: npm ci
      - name: Build the Journal
        run: npm run build
      - name: Check the build (pages, links, feeds, sizes)
        run: npm run test:ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
